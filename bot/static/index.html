<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xonqa Yoshlar Agentligi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── Variables ───────────────────────────────────────────── */
:root {
  --bg:          #f0f2f5;
  --surface:     #ffffff;
  --border:      #e5e7eb;
  --text:        #111827;
  --hint:        #6b7280;
  --primary:     #2678b6;
  --primary-lt:  #e8f1f9;
  --success:     #16a34a;
  --warning:     #d97706;
  --danger:      #dc2626;
  --success-bg:  #dcfce7;
  --warning-bg:  #fef3c7;
  --danger-bg:   #fee2e2;
  --sidebar-w:   240px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1117; --surface:#1c1e26; --border:#2d2f3d;
    --text:#f1f3f5; --hint:#9ca3af; --primary-lt:#1a2d42;
    --success-bg:#0f2e1a; --warning-bg:#2e1f00; --danger-bg:#2e0e0e;
  }
}
:root[data-theme="dark"] {
  --bg:#0f1117; --surface:#1c1e26; --border:#2d2f3d;
  --text:#f1f3f5; --hint:#9ca3af; --primary-lt:#1a2d42;
  --success-bg:#0f2e1a; --warning-bg:#2e1f00; --danger-bg:#2e0e0e;
}

/* ── Reset ───────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit}
a{color:var(--primary);text-decoration:none}

/* ── App shell ───────────────────────────────────────────── */
#root{min-height:100dvh}
#app{min-height:100dvh;display:flex;flex-direction:row}

/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);min-height:100dvh;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;overflow-y:auto;flex-shrink:0;
}
.sb-logo{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sb-logo-icon{font-size:28px;line-height:1;margin-bottom:6px}
.sb-logo-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.sb-logo-sub{font-size:11px;color:var(--hint);margin-top:2px}
.sb-user{padding:10px 16px;border-bottom:1px solid var(--border)}
.sb-user-name{font-size:13px;font-weight:600}
.sb-user-role{font-size:11px;color:var(--hint);margin-top:2px}
.sb-nav{flex:1;padding:6px 0}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  font-size:14px;color:var(--text);transition:background .12s;
}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--primary-lt);color:var(--primary);font-weight:600}
.nav-icon{font-size:17px;line-height:1;flex-shrink:0}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border)}
.btn-logout{
  display:flex;align-items:center;gap:8px;font-size:13px;
  color:var(--hint);cursor:pointer;background:none;border:none;padding:6px 0;width:100%;
}
.btn-logout:hover{color:var(--danger)}

/* ── Main area ───────────────────────────────────────────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-x:hidden}

/* ── Mobile header ───────────────────────────────────────── */
.mobile-header{
  position:sticky;top:0;z-index:100;background:var(--surface);
  border-bottom:1px solid var(--border);padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
.mh-title{flex:1;min-width:0}
.mh-title h1{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-title p{font-size:12px;color:var(--hint);margin-top:1px}

/* ── Bottom nav ──────────────────────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--border);display:flex;z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;cursor:pointer;background:none;border:none;
  color:var(--hint);font-size:11px;
}
.bnav-item.active{color:var(--primary)}
.bnav-icon{font-size:22px;line-height:1}

/* ── Desktop: hide mobile chrome ─────────────────────────── */
@media(min-width:768px){
  .mobile-header{display:none}
  .bottom-nav{display:none}
  #page-content{overflow-y:auto;height:calc(100dvh)}
}
@media(max-width:767px){
  .sidebar{display:none}
}

/* ── Page content ────────────────────────────────────────── */
#page-content{flex:1;display:flex;flex-direction:column}

/* ── Buttons ─────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;border:none;transition:opacity .15s,background .15s;white-space:nowrap;
}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-full{width:100%}

/* ── Badges ──────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.badge-done{background:var(--success-bg);color:var(--success)}
.badge-wait{background:var(--warning-bg);color:var(--warning)}
.badge-over{background:var(--danger-bg);color:var(--danger)}

/* ── Task list ───────────────────────────────────────────── */
.tasks-container{padding:14px;display:flex;flex-direction:column;gap:10px}
@media(min-width:900px){
  .tasks-container{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:14px;padding:20px 24px;align-content:start;
  }
  .tasks-full-row{grid-column:1/-1}
}
.task-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;
}
.task-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);border-color:var(--primary)}
.task-card:active{opacity:.85}
.tc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.tc-num{font-size:11px;color:var(--hint);font-weight:600}
.tc-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:6px}
.tc-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--hint);flex-wrap:wrap}
.prog-wrap{margin-top:10px}
.prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.pg-green{background:#22c55e}.pg-yellow{background:#f59e0b}.pg-red{background:#ef4444}
.prog-text{font-size:11px;color:var(--hint);margin-top:4px}

/* ── Detail / shared ─────────────────────────────────────── */
.detail-body{
  flex:1;padding:14px 14px 90px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
}
@media(min-width:768px){.detail-body{padding:20px 24px 40px;max-width:860px}}
.sec-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.sec-title{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--hint);margin-bottom:10px;
}

/* ── Stats (manager detail) ──────────────────────────────── */
.stats-row{display:flex;gap:10px;flex-wrap:wrap}
.stat-box{
  flex:1;min-width:72px;text-align:center;padding:12px 8px;
  background:var(--bg);border-radius:10px;
}
.stat-num{font-size:26px;font-weight:800;line-height:1;color:var(--primary)}
.stat-lbl{font-size:11px;color:var(--hint);margin-top:4px}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Submission list */
.sub-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.sub-item:last-child{border-bottom:none;padding-bottom:0}
.sub-avatar{
  width:32px;height:32px;border-radius:50%;background:var(--primary-lt);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--primary);flex-shrink:0;
}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-time{font-size:11px;color:var(--hint);margin-top:2px}

/* ZIP button */
.zip-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:12px;border-radius:10px;background:linear-gradient(135deg,#2678b6,#1e5a9c);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;
}
.zip-btn:hover{opacity:.9}
.zip-btn:active{opacity:.75}

/* ── File items ──────────────────────────────────────────── */
.file-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:var(--bg);border-radius:8px;margin-bottom:6px;
  cursor:pointer;transition:opacity .15s;
}
.file-item:last-child{margin-bottom:0}
.file-item:hover{opacity:.8}
.fi-icon{font-size:20px;flex-shrink:0}
.fi-info{flex:1;min-width:0}
.fi-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-type{font-size:11px;color:var(--hint);margin-top:1px}

/* ── Upload ──────────────────────────────────────────────── */
.upload-area{
  border:2px dashed var(--border);border-radius:12px;padding:24px 16px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;position:relative;
}
.upload-area:hover,.upload-area.has-files{border-color:var(--primary);background:var(--primary-lt)}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:30px;display:block;margin-bottom:6px}
.upload-lbl{font-size:14px;font-weight:500;color:var(--primary)}
.upload-hint{font-size:12px;color:var(--hint);margin-top:4px}
.sel-files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sel-file{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:8px 10px}
.sf-name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-size{font-size:11px;color:var(--hint);white-space:nowrap}
.sf-del{background:none;border:none;color:var(--hint);cursor:pointer;font-size:16px;padding:0 2px;line-height:1}
.sf-del:hover{color:var(--danger)}
.note-area{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
  resize:vertical;min-height:76px;outline:none;transition:border-color .15s;margin-top:8px;
}
.note-area:focus{border-color:var(--primary)}
.submitted-banner{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--success-bg);border-radius:10px;border:1px solid #86efac;margin-bottom:8px;
}
.sb-icon{font-size:22px}
.sb-lbl{font-size:13px;font-weight:600;color:var(--success)}
.sb-sub{font-size:12px;color:var(--success);opacity:.8;margin-top:2px}
.resubmit-note{font-size:12px;color:var(--hint);margin-bottom:8px}

/* ── Fixed bottom ────────────────────────────────────────── */
.fixed-bottom{
  position:sticky;bottom:0;background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}
@media(min-width:768px){.fixed-bottom{position:static;border-top:none;padding:16px 0 0}}

/* ── Forms ───────────────────────────────────────────────── */
.form-group{margin-bottom:14px}
.form-label{
  display:block;font-size:12px;font-weight:700;color:var(--hint);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;
}
.form-input{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;
  outline:none;transition:border-color .15s;
}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:90px}
.form-hint{font-size:12px;color:var(--hint);margin-top:4px}
.form-error{color:var(--danger);font-size:13px;margin-bottom:10px;display:none}
.pw-wrap{position:relative}
.pw-wrap .form-input{padding-right:42px}
.pw-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--hint);font-size:18px;padding:0;line-height:1;
}
.pw-eye:hover{color:var(--text)}
.pw-bar{height:4px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.pw-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0}
.pw-text{font-size:11px;margin-top:3px}

/* ── Login ───────────────────────────────────────────────── */
.login-wrap{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);
}
.login-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:32px 28px;width:100%;max-width:400px;
}
.login-logo{text-align:center;margin-bottom:24px}
.ll-icon{font-size:48px;display:block;margin-bottom:8px}
.ll-title{font-size:18px;font-weight:700}
.ll-sub{font-size:13px;color:var(--hint);margin-top:4px}
.login-err{
  background:var(--danger-bg);color:var(--danger);border-radius:8px;
  padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;
}
.login-err.show{display:block}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:14px}
.remember-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary)}

/* ── Employees table ─────────────────────────────────────── */
.table-wrap{overflow-x:auto}
.emp-table{width:100%;border-collapse:collapse}
.emp-table th{
  text-align:left;padding:9px 12px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;color:var(--hint);border-bottom:1px solid var(--border);
}
.emp-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:14px}
.emp-table tr:last-child td{border-bottom:none}
.emp-table tr:hover td{background:var(--bg)}
.emp-inactive td{opacity:.5}
@media(max-width:600px){.hide-sm{display:none}}

/* ── Modal ───────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:640px){.modal-overlay{align-items:center}}
.modal{
  background:var(--surface);border-radius:16px 16px 0 0;width:100%;
  max-height:92dvh;overflow-y:auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom));
}
@media(min-width:640px){
  .modal{border-radius:16px;max-width:480px;padding:24px;max-height:88dvh}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{
  background:none;border:none;color:var(--hint);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;
}
.modal-close:hover{color:var(--text)}

/* ── Misc ────────────────────────────────────────────────── */
.center-box{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:40px 20px;text-align:center;
}
.center-box .icon{font-size:48px}
.center-box p{color:var(--hint);font-size:14px;max-width:260px;line-height:1.5}
.spinner{
  width:34px;height:34px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;
}
.overlay-box{
  background:var(--surface);border-radius:16px;padding:28px 32px;
  display:flex;flex-direction:column;align-items:center;gap:14px;min-width:200px;
}
.overlay-text{font-size:14px;font-weight:500}
.success-overlay{
  position:fixed;inset:0;background:var(--surface);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;z-index:998;animation:fadeIn .3s;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.success-icon{font-size:72px;animation:popIn .4s .1s both}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
.success-title{font-size:20px;font-weight:700}
.success-sub{font-size:14px;color:var(--hint);text-align:center;max-width:240px;line-height:1.5}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;
  z-index:500;white-space:nowrap;pointer-events:none;
  animation:toastIn .2s,toastOut .3s 2.5s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(8px)}}
.dl-red{color:var(--danger);font-weight:600}
.dl-yellow{color:var(--warning);font-weight:600}
.dl-green{color:var(--success);font-weight:600}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.flex{display:flex}.gap-8{gap:8px}.gap-10{gap:10px}
.flex-1{flex:1}.items-center{align-items:center}
.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}
.text-hint{color:var(--hint)}.text-sm{font-size:13px}
</style>
</head>
<body>
<div id="root"><div class="center-box" style="min-height:100dvh"><div class="spinner"></div></div></div>

<script>
'use strict';

/* ── Telegram WebApp ──────────────────────────────────────── */
const tg = window.Telegram?.WebApp;
const TG_INIT = tg?.initData || '';
const IS_TG   = !!TG_INIT;
if (tg) { tg.ready(); tg.expand(); }

/* ── Storage ─────────────────────────────────────────────── */
const Store = {
  getToken() { return localStorage.getItem('tq_tok') || sessionStorage.getItem('tq_tok') || ''; },
  setToken(v, rem) {
    if (rem) { localStorage.setItem('tq_tok', v); sessionStorage.removeItem('tq_tok'); }
    else     { sessionStorage.setItem('tq_tok', v); localStorage.removeItem('tq_tok'); }
  },
  clear() { localStorage.removeItem('tq_tok'); sessionStorage.removeItem('tq_tok'); },
};

/* ── State ───────────────────────────────────────────────── */
const S = {
  page:       'loading',
  isManager:  false,
  user:       null,
  tasks:      [],
  activeTask: null,
  detail:     null,    // manager task detail (submissions svodka)
  employees:  [],
  selFiles:   [],
  note:       '',
};

/* ── API ─────────────────────────────────────────────────── */
async function api(path, opts = {}) {
  const tok = Store.getToken();
  const isForm = opts.body instanceof FormData;
  const headers = {
    ...(isForm ? {} : {'Content-Type':'application/json'}),
    ...(TG_INIT ? {'X-Telegram-Init-Data': TG_INIT} : {}),
    ...(tok ? {'X-Session-Token': tok} : {}),
    ...(opts.headers || {}),
  };
  if (opts.body && !isForm && typeof opts.body === 'object') opts.body = JSON.stringify(opts.body);
  const res = await fetch(path, {...opts, headers});
  if (res.status === 401 && !IS_TG) { Store.clear(); render({page:'login'}); return null; }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res;
}

/* ── Utilities ───────────────────────────────────────────── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fileIcon(name, kind) {
  if (!name && kind==='photo') return '🖼️';
  const ext = (name||'').split('.').pop().toLowerCase();
  const m = {xlsx:'📊',xls:'📊',docx:'📄',doc:'📄',pptx:'📑',ppt:'📑',pdf:'📋',jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',zip:'🗜️',rar:'🗜️',txt:'📝',mp4:'🎬',mp3:'🎵'};
  return m[ext] || (kind==='photo'?'🖼️':'📎');
}

function fsize(b) {
  if (!b) return '';
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch { return iso.slice(0,16).replace('T',' '); }
}

function deadlineFmt(iso) {
  if (!iso) return {text:'Muddat belgilanmagan',cls:''};
  const d=new Date(iso),now=new Date(),diff=d-now,abs=Math.abs(diff);
  const days=Math.floor(abs/86400000),hrs=Math.floor((abs%86400000)/3600000),mins=Math.floor((abs%3600000)/60000);
  const ds=d.toLocaleDateString('uz-UZ',{day:'numeric',month:'long'})+' '+d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
  if (diff<0) return {text:`${ds} — muddat o'tdi`,cls:'dl-red'};
  if (days>1) return {text:`${ds} · ${days} kun`,cls:'dl-green'};
  if (days===1) return {text:`${ds} · 1 kun ${hrs} soat`,cls:'dl-yellow'};
  return {text:`${ds} · ${hrs} soat ${mins} daqiqa`,cls:'dl-yellow'};
}

function pgCls(pct){ return pct>=80?'pg-green':pct>=40?'pg-yellow':'pg-red'; }
function initials(n){ return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function toast(msg) {
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3100);
}

function showAlert(msg) {
  if (IS_TG && tg.showAlert) tg.showAlert(msg);
  else alert(msg);
}

/* ── Render engine ───────────────────────────────────────── */
function render(patch={}) {
  Object.assign(S, patch);
  const root = document.getElementById('root');

  if (S.page==='loading') {
    root.innerHTML=`<div class="center-box" style="min-height:100dvh"><div class="spinner"></div></div>`;

  if (S.page==='login') {

}

function afterLogin() {
  const ph=document.getElementById('lphone'),pw=document.getElementById('lpw');
  if(ph) ph.addEventListener('keydown',e=>{if(e.key==='Enter')pw?.focus();});
  if(pw) pw.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

function togglePw(id,btn) {
  const i=document.getElementById(id);if(!i)return;
  i.type=i.type==='password'?'text':'password';
  btn.textContent=i.type==='password'?'👁️':'🙈';
}

async function doLogin() {
  const phone=(document.getElementById('lphone')?.value||'').trim();
  const pw   =document.getElementById('lpw')?.value||'';
  const rem  =document.getElementById('remember')?.checked||false;
  const errEl=document.getElementById('lerr');
  const btn  =document.getElementById('lbtn');
  if (!phone||!pw) { if(errEl){errEl.textContent='Telefon va parolni kiriting';errEl.classList.add('show');} return; }
  if(btn){btn.disabled=true;btn.textContent='Yuklanmoqda…';}
  if(errEl)errEl.classList.remove('show');
  try {
    const data=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password:pw})}).then(r=>r.json());
    if(data.error){if(errEl){errEl.textContent=data.error;errEl.classList.add('show');}if(btn){btn.disabled=false;btn.textContent='Kirish';}return;}
    Store.setToken(data.token,rem);
    S.isManager=data.role==='manager';
    S.user={first_name:data.name};
    await loadTasks();
    render({page:'tasks'});
  } catch(e) {
    if(errEl){errEl.textContent='Tarmoq xatosi: '+e.message;errEl.classList.add('show');}
    if(btn){btn.disabled=false;btn.textContent='Kirish';}
  }
}

/* ── Task list ───────────────────────────────────────────── */
async function loadTasks() {
  const data=await api('/api/tasks');
  if (!data) return;
  S.tasks=data.tasks||[];
  S.isManager=!!data.is_manager;
  if (!S.user) S.user=data.user;
}

function buildTaskList() {
  if (!S.tasks.length) return `<div class="center-box"><div class="icon">📭</div><p>Hozircha ochiq topshiriqlar yo'q</p></div>`;
  const addBtn=S.isManager?`
    <div class="tasks-full-row" style="margin-bottom:4px">
      <button class="btn btn-primary btn-full" onclick="gotoPage('create-task')">➕ Yangi topshiriq qo'shish</button>
    </div>`:'';
  const cards=S.tasks.map(t=>{
    const pct=t.total_count>0?Math.round(t.done_count/t.total_count*100):0;
    const dl=deadlineFmt(t.deadline);
    const badge=t.submitted_by_me?`<span class="badge badge-done">✅ Topshirdim</span>`:
      dl.cls==='dl-red'?`<span class="badge badge-over">🔴 Kechikdi</span>`:
      `<span class="badge badge-wait">⏳ Kutilmoqda</span>`;
    return `
    <div class="task-card" onclick="openTask(${t.id})">
      <div class="tc-head"><span class="tc-num">#${t.id}</span>${badge}</div>
      <div class="tc-title">${esc(t.title)}</div>
      <div class="tc-meta">
        <span>📅 ${dl.text.split('·')[0].trim()}</span>
        <span>👥 ${t.done_count}/${t.total_count}</span>
      </div>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill ${pgCls(pct)}" style="width:${pct}%"></div></div>
        <div class="prog-text">${pct}% bajarildi</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="tasks-container">${addBtn}${cards}</div>`;
}

/* ── Open task ───────────────────────────────────────────── */
async function openTask(id) {
  const t=S.tasks.find(x=>x.id===id);
  S.activeTask=t; S.selFiles=[]; S.note=''; S.detail=null;
  render({page:'task-detail'});
  if (S.isManager) {
    const d=await api(`/api/tasks/${id}/detail`);
    if (d&&!d.error) { S.detail=d; updatePage(); }

}

function onFiles(files) { S.selFiles=Array.from(files); renderSelFiles(); }
function removeFile(i) { S.selFiles.splice(i,1); renderSelFiles(); }
function renderSelFiles() {
  const w=document.getElementById('sfiles'),a=document.getElementById('uarea'),b=document.getElementById('subbtn');
  if (!w) return;
  if (!S.selFiles.length) { w.innerHTML=''; a?.classList.remove('has-files'); if(b)b.disabled=true; return; }
  a?.classList.add('has-files');
  if(b)b.disabled=false;
  w.innerHTML=S.selFiles.map((f,i)=>`
    <div class="sel-file">
      <span>${fileIcon(f.name,'')}</span>
      <span class="sf-name">${esc(f.name)}</span>
      <span class="sf-size">${fsize(f.size)}</span>
      <button class="sf-del" onclick="removeFile(${i})">✕</button>
    </div>`).join('');
}

async function doSubmit() {
  if (!S.selFiles.length) { showAlert('Avval fayl tanlang!'); return; }
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="overlay-box"><div class="spinner"></div><div class="overlay-text">Yuklanmoqda… ${S.selFiles.length} ta fayl</div></div>`;
  document.body.appendChild(ov);
  try {
    const fd=new FormData();
    fd.append('task_id',S.activeTask.id);
    if(S.note)fd.append('note',S.note);
    for(const f of S.selFiles)fd.append('files[]',f);
    const tok=Store.getToken();
    const headers={};
    if(TG_INIT)headers['X-Telegram-Init-Data']=TG_INIT;
    if(tok)headers['X-Session-Token']=tok;
    const res=await fetch('/api/submit',{method:'POST',headers,body:fd});
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    const t=S.tasks.find(x=>x.id===S.activeTask.id);
    if(t){t.submitted_by_me=true;t.done_count=data.done_count;t.total_count=data.total_count;t.my_submission={file_name:S.selFiles[0]?.name,submitted_at:new Date().toISOString()};}
    ov.remove();
    showSuccessOverlay(data.done_count,data.total_count);
  } catch(e) { ov.remove(); showAlert('Xato: '+e.message); }
}

function showSuccessOverlay(done,total) {
  const el=document.createElement('div');
  el.className='success-overlay';
  el.innerHTML=`<div class="success-icon">✅</div><div class="success-title">Topshirildi!</div><div class="success-sub">${done}/${total} xodim bajargan</div>`;
  document.body.appendChild(el);
  if(tg)tg.HapticFeedback?.notificationOccurred('success');
  setTimeout(()=>{el.remove();gotoPage('tasks');},2200);
}

function dlFile(fileId,name) {
  const tok=Store.getToken(),init=TG_INIT;
  const p=init?`init=${encodeURIComponent(init)}`:`token=${encodeURIComponent(tok)}`;
  const a=document.createElement('a');
  a.href=`/api/file/${fileId}?${p}`;a.download=name||'fayl';
  document.body.appendChild(a);a.click();a.remove();
}

function dlZip(taskId) {
  const tok=Store.getToken(),init=TG_INIT;
  const p=init?`init=${encodeURIComponent(init)}`:`token=${encodeURIComponent(tok)}`;
  window.open(`/api/tasks/${taskId}/zip?${p}`,'_blank');
}

/* ── Create task ─────────────────────────────────────────── */
function buildCreateTask() {
  return `
  <div class="detail-body">
    <div class="sec-card">
      <div class="sec-title">➕ Yangi topshiriq yaratish</div>
      <div class="form-group">
        <label class="form-label" for="ct-title">Topshiriq nomi *</label>
        <input class="form-input" id="ct-title" type="text" placeholder="Masalan: Hisobot tayyorlash">
      </div>
      <div class="form-group">
        <label class="form-label" for="ct-desc">Batafsil tavsif</label>
        <textarea class="form-input" id="ct-desc" placeholder="Topshiriq haqida batafsil…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="ct-dl">Muddat</label>
        <input class="form-input" id="ct-dl" type="datetime-local">
        <div class="form-hint">Bo'sh qolsangiz topshiriq belgilangan muddat siz ochiq qoladi</div>
      </div>
      <div class="form-error" id="ct-err"></div>
      <button class="btn btn-primary btn-full" id="ct-btn" onclick="doCreateTask()">✅ Topshiriq yaratish</button>
    </div>
  </div>`;
}

function bindCreateTask() {
  const inp=document.getElementById('ct-dl');
  if (inp) {
    const d=new Date();d.setDate(d.getDate()+1);d.setHours(18,0,0,0);
    inp.value=d.toISOString().slice(0,16);
  }
}

async function doCreateTask() {
  const title=(document.getElementById('ct-title')?.value||'').trim();
  const desc =(document.getElementById('ct-desc')?.value||'').trim();
  const dlRaw=document.getElementById('ct-dl')?.value||'';
  const errEl=document.getElementById('ct-err');
  const btn  =document.getElementById('ct-btn');
  if(!title){if(errEl){errEl.textContent="Topshiriq nomini kiriting";errEl.style.display='block';}return;}
  if(btn){btn.disabled=true;btn.textContent='Saqlanmoqda…';}
  if(errEl)errEl.style.display='none';
  try {
    const body={title,description:desc};
    if(dlRaw)body.deadline=new Date(dlRaw).toISOString();
    const data=await api('/api/tasks',{method:'POST',body});
    if(!data||data.error)throw new Error(data?.error||'Xato');
    await loadTasks();
    toast('✅ Topshiriq yaratildi!');
    render({page:'tasks'});
  } catch(e) {
    if(errEl){errEl.textContent=e.message;errEl.style.display='block';}
    if(btn){btn.disabled=false;btn.textContent='✅ Topshiriq yaratish';}
  }
}

/* ── Employees ───────────────────────────────────────────── */
async function loadEmployees() {
  const d=await api('/api/employees');
  if(d&&d.employees)S.employees=d.employees;
}

function buildEmployees() {
  const emps=S.employees;
  const total=emps.length,active=emps.filter(e=>e.active).length;
  const rows=emps.map(e=>`
    <tr class="${e.active?'':'emp-inactive'}">
      <td>
        <div style="font-weight:600">${esc(e.full_name)}</div>
        ${e.position?`<div style="font-size:12px;color:var(--hint)">${esc(e.position)}</div>`:''}
      </td>
      <td class="hide-sm">${esc(e.login_phone||'—')}</td>
      <td class="hide-sm">${e.has_password?`<span class="badge badge-done">✅ Bor</span>`:`<span class="badge badge-over">❌ Yo'q</span>`}</td>
      <td><span class="${e.active?'badge badge-done':'badge badge-over'}">${e.active?'✅ Faol':'⛔ Nofaol'}</span></td>
      <td>
        <div class="flex gap-8">
          <button class="btn btn-ghost btn-sm" onclick="openEmpModal(${e.tg_id})">✏️</button>
          <button class="btn btn-ghost btn-sm" onclick="delEmp(${e.tg_id},'${esc(e.full_name)}')">🗑️</button>
        </div>
      </td>
    </tr>`).join('')||`<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--hint)">Xodimlar yo'q. Qo'shish tugmasini bosing.</td></tr>`;
  return `
  <div style="padding:14px;display:flex;flex-direction:column;gap:14px">
    <div class="sec-card">
      <div class="flex items-center justify-between" style="margin-bottom:12px">
        <div>
          <div style="font-size:17px;font-weight:700">Xodimlar</div>
          <div class="text-hint text-sm">${active} faol / ${total} jami</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openEmpModal(null)">➕ Qo'shish</button>
      </div>
      <div class="table-wrap">
        <table class="emp-table">
          <thead><tr>
            <th>Ism Sharif</th><th class="hide-sm">Telefon</th>
            <th class="hide-sm">Parol</th><th>Holat</th><th>Amal</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="emp-modal"></div>`;
}

function openEmpModal(tgId) {
  const emp=tgId!=null?S.employees.find(e=>e.tg_id===tgId):null;
  const edit=!!emp;
  const html=`
  <div class="modal-overlay" onclick="if(event.target===this)closeEmpModal()">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${edit?'✏️ Xodimni tahrirlash':'➕ Yangi xodim qo\'shish'}</div>
        <button class="modal-close" onclick="closeEmpModal()">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Ism Sharif *</label>
        <input class="form-input" id="em-name" type="text" placeholder="Qodirov Sherzod Aliyevich" value="${esc(emp?.full_name||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Lavozim</label>
        <input class="form-input" id="em-pos" type="text" placeholder="Mutaxassis" value="${esc(emp?.position||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">Login telefon *</label>
        <input class="form-input" id="em-phone" type="tel" placeholder="+998901234567" value="${esc(emp?.login_phone||'')}">
        <div class="form-hint">Xodim shu raqam bilan kiradi</div>
      </div>
      <div class="form-group">
        <label class="form-label">${edit?"Yangi parol (bo'sh = o'zgarmaydi)":'Parol *'}</label>
        <div class="pw-wrap">
          <input class="form-input" id="em-pw" type="password" placeholder="${edit?'Yangi parol (ixtiyoriy)':'Parol kiriting'}" oninput="pwStr(this.value)">
          <button class="pw-eye" type="button" onclick="togglePw('em-pw',this)">👁️</button>
        </div>
        <div class="pw-bar"><div class="pw-fill" id="pwfill"></div></div>
        <div class="pw-text" id="pwtxt"></div>
      </div>
      ${edit?`
      <div class="form-group">
        <label class="form-label">Holat</label>
        <select class="form-input" id="em-active">
          <option value="1" ${emp?.active?'selected':''}>✅ Faol</option>
          <option value="0" ${!emp?.active?'selected':''}>⛔ Nofaol</option>
        </select>
      </div>`:''}
      <div class="form-error" id="em-err"></div>
      <button class="btn btn-primary btn-full" onclick="saveEmp(${edit?tgId:'null'})">
        ${edit?'💾 Saqlash':"➕ Xodim qo'shish"}
      </button>
    </div>
  </div>`;
  const c=document.getElementById('emp-modal');if(c)c.innerHTML=html;
}

function closeEmpModal(){ const c=document.getElementById('emp-modal');if(c)c.innerHTML=''; }

function pwStr(v) {
  const fill=document.getElementById('pwfill'),txt=document.getElementById('pwtxt');
  if(!fill||!txt)return;
  let sc=0;
  if(v.length>=6)sc++;if(v.length>=8)sc++;
  if(/[0-9]/.test(v)&&/[a-zA-Z]/.test(v))sc++;
  if(/[!@#$%^&*_]/.test(v))sc++;
  const pcts=[0,25,50,75,100];const colors=['','#ef4444','#f59e0b','#22c55e','#16a34a'];const labels=['','Juda zaif','Zaif','Yaxshi','Kuchli'];
  fill.style.width=pcts[sc]+'%';fill.style.background=colors[sc];
  txt.textContent=v?labels[sc]:'';txt.style.color=colors[sc];
}

async function saveEmp(tgId) {
  const name =(document.getElementById('em-name')?.value||'').trim();
  const pos  =(document.getElementById('em-pos')?.value||'').trim();
  const phone=(document.getElementById('em-phone')?.value||'').trim();
  const pw   =document.getElementById('em-pw')?.value||'';
  const active=parseInt(document.getElementById('em-active')?.value||'1');
  const errEl=document.getElementById('em-err');
  if(!name||!phone){if(errEl){errEl.textContent='Ism va telefon majburiy';errEl.style.display='block';}return;}
  if(tgId==null&&!pw){if(errEl){errEl.textContent='Parol majburiy';errEl.style.display='block';}return;}
  try {
    let data;
    if(tgId==null) {
      data=await api('/api/employees',{method:'POST',body:{full_name:name,position:pos,login_phone:phone,password:pw}});
    } else {
      const body={full_name:name,position:pos,login_phone:phone,active};
      if(pw)body.password=pw;
      data=await api(`/api/employees/${tgId}`,{method:'PUT',body});
    }
    if(!data||data.error)throw new Error(data?.error||'Xato');
    closeEmpModal();
    await loadEmployees();
    render({page:'employees'});
    toast(tgId==null?"✅ Xodim qo'shildi":'✅ Xodim yangilandi');
  } catch(e) { if(errEl){errEl.textContent=e.message;errEl.style.display='block';} }
}

async function delEmp(tgId,name) {
  if(!confirm(`"${name}" ni o'chirishni tasdiqlaysizmi?`))return;
  const data=await api(`/api/employees/${tgId}`,{method:'DELETE'});
  if(data?.ok){ await loadEmployees(); render({page:'employees'}); toast("🗑️ Xodim o'chirildi"); }
  else toast('Xato: '+(data?.error||"Noma'lum"));
}

/* ── Init ────────────────────────────────────────────────── */
(async()=>{
  render({page:'loading'});

  // Telegram Mini App
  if (IS_TG) {
    try { await loadTasks(); render({page:'tasks'}); }
    catch(e) {
      document.getElementById('root').innerHTML=`
        <div class="center-box" style="min-height:100dvh">
          <div class="icon">⚠️</div><p>Yuklab bo'lmadi<br><small>${esc(e.message)}</small></p>
        </div>`;
    }
    return;
  }

  // Web browser — check stored session
  const tok=Store.getToken();
  if (tok) {
    try {
      const me=await fetch('/api/me',{headers:{'X-Session-Token':tok}}).then(r=>r.json());
      if(me.user){ S.user=me.user; S.isManager=!!me.is_manager; await loadTasks(); render({page:'tasks'}); return; }
    } catch(_){}
    Store.clear();
  }
  render({page:'login'});
})();
</script>
</body>
</html>
